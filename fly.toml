app = "fly-n8n-z2g57w"
primary_region = "cdg"

[build]
  image = "n8nio/n8n:latest"

[env]
  GENERIC_TIMEZONE             = "Europe/Paris"
  N8N_BASIC_AUTH_ACTIVE        = "true"
  N8N_BASIC_AUTH_USER          = "bisonrouge"
  N8N_PORT                     = "5678"
  N8N_HOST                     = "fly-n8n-z2g57w.fly.dev"
  N8N_LISTEN_ADDRESS           = "0.0.0.0"
  N8N_PROTOCOL                 = "https"
  N8N_EDITOR_BASE_URL          = "https://fly-n8n-z2g57w.fly.dev"
  N8N_RUNNERS_ENABLED          = "true"
  DB_SQLITE_VACUUM_ON_STARTUP  = "true"

[[services]]
  internal_port = 5678
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    interval = 10000
    timeout = 2000
    grace_period = "10s"
    restart_limit = 0

[[services.mounts]]
  source      = "n8n_vol"
  destination = "/home/node/.n8n"
